<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Flex-wrap CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f6f8;
        }

        h2 {
            color: #333;
        }

        /* Bộ nút điều khiển giá trị */
        .controls {
            margin-bottom: 20px;
        }

        .controls button {
            padding: 8px 16px;
            margin-right: 8px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #007bff;
            background-color: #ffffff;
            color: #007bff;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .controls button:hover,
        .controls button.active {
            background-color: #007bff;
            color: #ffffff;
        }

        /* Container Flexbox */
        .container {
            display: flex;
            flex-wrap: wrap;
            /* Giá trị thử nghiệm */
            width: 600px;
            height: 300px;
            gap: 10px;
            border: 2px solid #333;
            background-color: #ffffff;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Các Flex Items */
        .item {
            width: 180px;
            height: 80px;
            background-color: #4dabf7;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h2>Thực hành thuộc tính <code>flex-wrap</code></h2>

    <div class="controls">
        <button onclick="changeWrap('nowrap')" class="active">nowrap</button>
        <button onclick="changeWrap('wrap')">wrap</button>
        <button onclick="changeWrap('wrap-reverse')">wrap-reverse</button>
        <button onclick="changeWrap('initial')">initial</button>
    </div>

    <div class="container" id="flexContainer">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <script>
        function changeWrap(value) {
            const container = document.getElementById('flexContainer');
            container.style.flexWrap = value;

            // Cập nhật trạng thái active cho nút bấm
            const buttons = document.querySelectorAll('.controls button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>

</body>

</html>
